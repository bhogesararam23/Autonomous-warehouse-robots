name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python unit tests
        run: python -m unittest discover

      - name: Smoke-test standard warehouse
        run: python warehouse_astar_sim.py --no-svg

      - name: Smoke-test peak-traffic scenario
        run: python warehouse_astar_sim.py --scenario peak-traffic --no-svg

  cpp-core:
    name: C++ A* core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and test the ROS-independent planner core
        run: ./scripts/test_cpp_core.sh

  ros2-workspace:
    name: ROS 2 Jazzy workspace and Open-RMF assets
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble
    timeout-minutes: 35
    steps:
      - name: Install CMake
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh rosdep and install workspace dependencies
        run: |
          rosdep update
          # ament_python is a ROS build type, not a resolvable rosdep system key.
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro jazzy \
            --skip-keys ament_python \
            -r -y

      - name: Build and test ROS packages and Open-RMF assets
        run: ./scripts/test_ros2_workspace.sh

  ui:
    name: UI checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run TypeScript tests
        working-directory: ui
        run: npm run test:ts

      - name: Run cross-language planner parity fixtures
        run: python3 scripts/test_planner_parity.py

      - name: Run seeded episode replay parity
        run: python3 scripts/test_episode_replay.py

      - name: Run ESLint
        working-directory: ui
        run: npm run lint

      - name: Build production UI
        working-directory: ui
        run: npm run build
